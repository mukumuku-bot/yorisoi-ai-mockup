<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>よりそいAI｜操作支援</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="phone scene">
    <div class="os-status"><span>9:41</span><span>5G</span></div>
    <div class="home-grid" aria-label="スマートフォンのホーム画面">
      <div class="tile"><span class="mark ico-call"><svg viewBox="0 0 24 24"><path d="M6.6 3.8h3.1l1 4.1-2 1.2a12.5 12.5 0 0 0 6.2 6.2l1.2-2 4.1 1v3.1c0 .9-.7 1.6-1.6 1.6C10.4 19 5 13.6 5 5.4 5 4.5 5.7 3.8 6.6 3.8z"/></svg></span><span>電話</span></div>
      <div class="tile"><span class="mark ico-photo"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><circle cx="9" cy="10.2" r="1.5"/><path d="m7.5 16.5 3.4-3.6 2.4 2.4 2.2-2.3 3.5 3.5"/></svg></span><span>写真</span></div>
      <div class="tile"><span class="mark ico-map"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.4 6-10.2A6 6 0 0 0 6 10.8C6 15.6 12 21 12 21z"/><circle cx="12" cy="10.8" r="1.8" fill="#fff" stroke="none"/></svg></span><span>地図</span></div>
      <div class="tile"><span class="mark ico-mail"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="m4 7.5 8 6 8-6"/></svg></span><span>メール</span></div>
      <div class="tile"><span class="mark ico-clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.4l3 1.8"/></svg></span><span>時計</span></div>
      <div class="tile"><span class="mark ico-weather"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="3.2"/><path d="M7 17h9.2a3.3 3.3 0 0 0 .4-6.5A5 5 0 0 0 8.2 9"/></svg></span><span>天気</span></div>
      <div class="tile target" aria-label="対象アプリ ゲーム">
        <span class="mark ico-game"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="3"/><path d="M8 13h3M9.5 11.5v3M16.2 12.2h.1M18.2 14.2h.1"/></svg></span>
        <span>ゲーム</span>
      </div>
      <div class="tile"><span class="mark ico-cam"><svg viewBox="0 0 24 24"><path d="M8 8 9.4 6h5.2L16 8h3.2a1.8 1.8 0 0 1 1.8 1.8v8.4a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 18.2V9.8A1.8 1.8 0 0 1 4.8 8H8z"/><circle cx="12" cy="14" r="3"/></svg></span><span>カメラ</span></div>
    </div>
    <aside class="inset" aria-label="長押しした後の画面">
      <p class="cap">長押ししたあと</p>
      <div class="row">アプリ情報</div>
      <div class="row">ウィジェットを追加</div>
      <div class="row danger">アンインストール</div>
    </aside>
    <section class="coach" aria-label="よりそいAIの案内">
      <div>
        <p class="who">よりそいAI　操作支援</p>
        <h2>ゲームアプリを長押ししてください。</h2>
        <p>アイコンを指で押し続けてください。<br>続いて「アンインストール」を選んでください。</p>
      </div>
      <button type="button" class="speak" aria-label="音声で案内">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="#fff"/><path d="M15.2 8.5a4.2 4.2 0 0 1 0 7M17.6 6.4a7.2 7.2 0 0 1 0 11.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </section>
  </main>
</body>
</html>
