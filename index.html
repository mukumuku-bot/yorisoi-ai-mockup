<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>よりそいAI モックアップ</title>
  <link rel="stylesheet" href="app.css?v=8">
</head>
<body>
  <main class="gallery">
    <h1>よりそいAI</h1>
    <p class="lead">画像を押すと、実際のスマホ画面が開きます。</p>

    <h2 class="section">AIによる状況に応じた支援</h2>
    <p class="lead tight">利用者の状況を理解し、必要な操作・判断をサポートします。</p>
    <div class="cards">
      <a class="card" href="guide.html">
        <img src="thumbs/guide.png" alt="操作支援：アプリの削除">
        <div class="meta">
          <h2>① 操作支援</h2>
          <p>アプリを長押しするよう、通知と音声で案内します。</p>
        </div>
      </a>
      <a class="card" href="explain.html">
        <img src="thumbs/explain.png" alt="文章解説：位置情報の許可">
        <div class="meta">
          <h2>② 文章解説</h2>
          <p>ポップアップの意味と、操作の影響を説明します。</p>
        </div>
      </a>
      <a class="card" href="safety.html">
        <img src="thumbs/safety.png" alt="安全性検査：不審なSMS">
        <div class="meta">
          <h2>③ 安全性検査</h2>
          <p>危険性・判断理由・対処方法まで表示します。</p>
        </div>
      </a>
    </div>

    <h2 class="section">アプリの画面</h2>
    <p class="lead tight">相談の始め方です。</p>
    <div class="cards">
      <a class="card" href="home.html">
        <img src="thumbs/home.png" alt="ホーム画面">
        <div class="meta">
          <h2>ホーム画面</h2>
          <p>困っている内容を3つのボタンから選びます。</p>
        </div>
      </a>
      <a class="card" href="consult.html">
        <img src="thumbs/consult.png" alt="困りごとの入力">
        <div class="meta">
          <h2>困りごとの入力</h2>
          <p>文章・音声・選択肢のどれからでも相談できます。</p>
        </div>
      </a>
      <a class="card" href="followup.html">
        <img src="thumbs/followup.png" alt="AIの追加質問">
        <div class="meta">
          <h2>AIの追加質問</h2>
          <p>曖昧な相談を、選択肢で具体化します。</p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
