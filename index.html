<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>よりそいAI モックアップ</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="gallery">
    <h1>よりそいAI</h1>
    <p class="lead">画像を押すと、実際のスマホ画面が開きます。</p>
    <div class="cards">
      <a class="card" href="home.html">
        <img src="thumbs/home.png" alt="ホーム画面">
        <div class="meta">
          <h2>ホーム画面</h2>
          <p>困っている内容を3つのボタンから選びます。</p>
        </div>
      </a>
      <a class="card" href="consult.html">
        <img src="thumbs/consult.png" alt="困りごとの入力">
        <div class="meta">
          <h2>困りごとの入力</h2>
          <p>文章・音声・選択肢のどれからでも相談できます。</p>
        </div>
      </a>
      <a class="card" href="followup.html">
        <img src="thumbs/followup.png" alt="AIの追加質問">
        <div class="meta">
          <h2>AIの追加質問</h2>
          <p>曖昧な相談を、選択肢で具体化します。</p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
