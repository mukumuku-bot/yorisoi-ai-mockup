<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>よりそいAI｜文章解説</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="phone scene">
    <div class="os-status"><span>9:41</span><span>5G</span></div>
    <div class="map-bg" aria-hidden="true"><span class="map-pin"></span></div>
    <section class="dialog" aria-label="位置情報の許可ポップアップ">
      <h1>位置情報の使用を許可しますか？</h1>
      <p>このアプリが位置情報を使用することを許可しますか？</p>
      <div class="btns">
        <span class="deny">許可しない</span>
        <span class="allow">許可</span>
      </div>
    </section>
    <section class="coach" aria-label="よりそいAIの解説">
      <div>
        <p class="who">よりそいAI　文章解説</p>
        <h2>これは位置情報の利用確認です。</h2>
        <p>許可すると、あなたの現在地が取得されます。<br>音声でも詳しく説明します。</p>
      </div>
      <button type="button" class="speak" aria-label="音声で詳しく説明">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4z" fill="#fff"/><path d="M15.2 8.5a4.2 4.2 0 0 1 0 7M17.6 6.4a7.2 7.2 0 0 1 0 11.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </section>
  </main>
</body>
</html>
