<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よりそいAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eceff4;
      font-family: "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", sans-serif;
    }
    .device {
      width: 393px;
      height: 852px;
      background: #1c2333;
      border-radius: 54px;
      padding: 10px;
      position: relative;
      box-shadow:
        0 18px 24px rgba(28, 35, 51, 0.12),
        0 40px 70px rgba(28, 35, 51, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-l,
    .btn-l2,
    .btn-l3,
    .btn-r {
      position: absolute;
      background: #121722;
      width: 4px;
      border-radius: 2px;
    }
    .btn-l { left: -3px; top: 142px; height: 28px; }
    .btn-l2 { left: -3px; top: 192px; height: 56px; }
    .btn-l3 { left: -3px; top: 256px; height: 56px; }
    .btn-r { right: -3px; top: 220px; height: 92px; }
    .screen {
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 6;
    }
    .top {
      background: #1b7a4a;
      padding: 0 20px 16px;
      color: #fff;
    }
    .status {
      height: 52px;
      padding: 14px 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .fiveg {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px;
    }
    .app-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .settings {
      border: 0;
      background: transparent;
      color: #fff;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 52px;
    }
    .settings span {
      font-size: 13px;
      font-weight: 700;
    }
    .body {
      flex: 1;
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hero {
      background: #fff;
      border-radius: 22px;
      padding: 22px 16px 20px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(28, 35, 51, 0.06);
    }
    .hero h1 {
      font-size: 30px;
      font-weight: 700;
      color: #16324d;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 16px;
      color: #4b5563;
      line-height: 1.5;
    }
    .action {
      appearance: none;
      width: 100%;
      min-height: 148px;
      border-radius: 22px;
      background: #fff;
      padding: 16px 10px 16px 14px;
      display: grid;
      grid-template-columns: 64px 1fr 18px;
      gap: 12px;
      align-items: center;
      text-align: left;
      font-family: inherit;
      box-shadow: 0 8px 18px rgba(28, 35, 51, 0.07);
    }
    .guide { border: 2.5px solid #3dcc8a; }
    .text { border: 2.5px solid #f5a623; }
    .safe { border: 2.5px solid #ff6b81; }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
    }
    .icon svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .guide .icon { background: #2ec98a; }
    .text .icon { background: #f5a623; }
    .safe .icon { background: #ff6b81; }
    .copy h2 {
      font-size: 24px;
      font-weight: 700;
      color: #16324d;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .copy p {
      font-size: 14.5px;
      line-height: 1.45;
      color: #4b5563;
      word-break: keep-all;
    }
    .chev { width: 22px; height: 22px; }
    .guide .chev { color: #2ec98a; }
    .text .chev { color: #f5a623; }
    .safe .chev { color: #ff6b81; }
    .home-bar {
      height: 26px;
      display: grid;
      place-items: center;
    }
    .home-bar span {
      width: 130px;
      height: 5px;
      background: #111;
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <main class="device" aria-label="よりそいAI ホーム画面">
    <span class="btn-l"></span>
    <span class="btn-l2"></span>
    <span class="btn-l3"></span>
    <span class="btn-r"></span>
    <section class="screen">
      <div class="island" aria-hidden="true"></div>
      <div class="top">
        <div class="status">
          <span>9:41</span>
          <div class="status-right" aria-hidden="true">
            <span class="fiveg">5G</span>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.7" y="1" width="20.2" height="10" rx="2.2" stroke="#fff" fill="none" stroke-width="1.3"/><rect x="2.2" y="2.5" width="14.8" height="7" rx="1.1" fill="#fff"/><rect x="21.6" y="3.8" width="1.8" height="4.4" rx="0.6" fill="#fff"/></svg>
          </div>
        </div>
        <header class="appbar">
          <p class="app-name">よりそいAI</p>
          <button type="button" class="settings" aria-label="設定・利用情報">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#fff" d="M10.1 2.3h3.8l.35 2.15c.62.2 1.2.5 1.73.9l2.15-.85 1.9 3.25-1.75 1.35c.12.5.2 1.02.2 1.55s-.08 1.05-.2 1.55l1.75 1.35-1.9 3.25-2.15-.85c-.53.4-1.11.7-1.73.9l-.35 2.15h-3.8l-.35-2.15c-.62-.2-1.2-.5-1.73-.9l-2.15.85-1.9-3.25 1.75-1.35A6.7 6.7 0 0 1 5 12c0-.53.08-1.05.2-1.55L3.45 9.1l1.9-3.25 2.15.85c.53-.4 1.11-.7 1.73-.9L10.1 2.3Zm1.9 6.3A3.4 3.4 0 1 0 12 15.5 3.4 3.4 0 0 0 12 8.6Z"/>
            </svg>
            <span>設定</span>
          </button>
        </header>
      </div>
      <div class="body">
        <div class="hero">
          <h1>どうしましたか？</h1>
          <p>お困りの内容を選んでください。</p>
        </div>
        <button type="button" class="action guide">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="7" y="2.4" width="10" height="19.2" rx="2.2"/>
              <path d="M10 5.2h4"/>
              <circle cx="12" cy="18.4" r="0.85" fill="#fff" stroke="none"/>
            </svg>
          </span>
          <span class="copy">
            <h2>操作支援</h2>
            <p>スマートフォンの操作方法を<br>案内します。</p>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="action text">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4.5 6c2.3-1.3 4.7-1.4 7.5 0v12.4c-2.8-1.4-5.2-1.3-7.5 0V6z"/>
              <path d="M19.5 6c-2.3-1.3-4.7-1.4-7.5 0v12.4c2.8-1.4 5.2-1.3 7.5 0V6z"/>
            </svg>
          </span>
          <span class="copy">
            <h2>文章解説</h2>
            <p>画面の言葉や文章を<br>分かりやすく説明します。</p>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="action safe">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3.2 5 6.4v6.1c0 4.3 2.9 7.4 7 9.1 4.1-1.7 7-4.8 7-9.1V6.4L12 3.2z"/>
              <path d="m8.8 12.1 2.2 2.2 4.3-4.4"/>
            </svg>
          </span>
          <span class="copy">
            <h2>安全性検査</h2>
            <p>不審な電話やSMSなどを<br>確認します。</p>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="home-bar" aria-hidden="true"><span></span></div>
    </section>
  </main>
</body>
</html>
