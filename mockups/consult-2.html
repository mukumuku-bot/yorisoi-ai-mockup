<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よりそいAI｜操作支援</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eceff4;
      font-family: "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", sans-serif;
    }
    .device {
      width: 393px;
      height: 852px;
      background: #1c2333;
      border-radius: 54px;
      padding: 10px;
      position: relative;
      box-shadow:
        0 18px 24px rgba(28, 35, 51, 0.12),
        0 40px 70px rgba(28, 35, 51, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-l, .btn-l2, .btn-l3, .btn-r {
      position: absolute;
      background: #121722;
      width: 4px;
      border-radius: 2px;
    }
    .btn-l { left: -3px; top: 142px; height: 28px; }
    .btn-l2 { left: -3px; top: 192px; height: 56px; }
    .btn-l3 { left: -3px; top: 256px; height: 56px; }
    .btn-r { right: -3px; top: 220px; height: 92px; }
    .screen {
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 6;
    }
    .top {
      background: #1b7a4a;
      padding: 0 16px 14px;
      color: #fff;
    }
    .status {
      height: 52px;
      padding: 14px 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
    }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .fiveg { font-size: 12px; font-weight: 800; }
    .appbar {
      display: grid;
      grid-template-columns: 36px 1fr 52px;
      align-items: center;
      gap: 6px;
    }
    .back {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
    }
    .app-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .screen-name { font-size: 13px; font-weight: 700; opacity: 0.9; margin-top: 2px; }
    .settings {
      border: 0;
      background: transparent;
      color: #fff;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .settings span { font-size: 13px; font-weight: 700; }
    .chat {
      flex: 1;
      padding: 14px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user {
      align-self: flex-end;
      max-width: 82%;
      background: #1b7a4a;
      color: #fff;
      border-radius: 18px 18px 6px 18px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }
    .ai {
      align-self: stretch;
      background: #fff;
      border-radius: 18px;
      padding: 14px 16px 12px;
      box-shadow: 0 6px 16px rgba(28, 35, 51, 0.06);
    }
    .ai p {
      font-size: 16px;
      color: #16324d;
      font-weight: 700;
      line-height: 1.5;
    }
    .ai .sub {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 500;
      color: #4b5563;
    }
    .choice {
      appearance: none;
      width: 100%;
      min-height: 56px;
      border: 2px solid #d7ddd8;
      background: #fff;
      border-radius: 16px;
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      color: #16324d;
    }
    .choice svg { width: 20px; height: 20px; color: #1b7a4a; flex-shrink: 0; }
    .composer {
      display: grid;
      grid-template-columns: 1fr 64px;
      gap: 10px;
      padding: 0 16px 8px;
    }
    .field {
      min-height: 56px;
      border: 2px solid #d7ddd8;
      background: #fff;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 15px;
      color: #8b949e;
      display: flex;
      align-items: center;
    }
    .mic {
      border: 0;
      background: #1b7a4a;
      color: #fff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
    }
    .home-bar { height: 24px; display: grid; place-items: center; }
    .home-bar span { width: 130px; height: 5px; background: #111; border-radius: 99px; }
  </style>
</head>
<body>
  <main class="device" aria-label="よりそいAI 追加質問画面">
    <span class="btn-l"></span><span class="btn-l2"></span><span class="btn-l3"></span><span class="btn-r"></span>
    <section class="screen">
      <div class="island" aria-hidden="true"></div>
      <div class="top">
        <div class="status">
          <span>9:41</span>
          <div class="status-right" aria-hidden="true">
            <span class="fiveg">5G</span>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.7" y="1" width="20.2" height="10" rx="2.2" stroke="#fff" fill="none" stroke-width="1.3"/><rect x="2.2" y="2.5" width="14.8" height="7" rx="1.1" fill="#fff"/><rect x="21.6" y="3.8" width="1.8" height="4.4" rx="0.6" fill="#fff"/></svg>
          </div>
        </div>
        <header class="appbar">
          <button type="button" class="back" aria-label="ホームに戻る">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div>
            <p class="app-name">よりそいAI</p>
            <p class="screen-name">操作支援</p>
          </div>
          <button type="button" class="settings" aria-label="設定・利用情報">
            <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M10.1 2.3h3.8l.35 2.15c.62.2 1.2.5 1.73.9l2.15-.85 1.9 3.25-1.75 1.35c.12.5.2 1.02.2 1.55s-.08 1.05-.2 1.55l1.75 1.35-1.9 3.25-2.15-.85c-.53.4-1.11.7-1.73.9l-.35 2.15h-3.8l-.35-2.15c-.62-.2-1.2-.5-1.73-.9l-2.15.85-1.9-3.25 1.75-1.35A6.7 6.7 0 0 1 5 12c0-.53.08-1.05.2-1.55L3.45 9.1l1.9-3.25 2.15.85c.53-.4 1.11-.7 1.73-.9L10.1 2.3Zm1.9 6.3A3.4 3.4 0 1 0 12 15.5 3.4 3.4 0 0 0 12 8.6Z"/></svg>
            <span>設定</span>
          </button>
        </header>
      </div>
      <div class="chat">
        <div class="user">LINEがなんだか変になった。</div>
        <div class="ai">
          <p>どのような状態ですか？</p>
          <p class="sub">近いものを選んでください。</p>
        </div>
        <button type="button" class="choice">メッセージが送れない<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="choice">画面の表示がいつもと違う<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="choice">通知が届かなくなった<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="choice">よく分からない<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="composer">
        <div class="field">近いものがなければ、ここに書く</div>
        <button type="button" class="mic" aria-label="音声で話す">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          話す
        </button>
      </div>
      <div class="home-bar" aria-hidden="true"><span></span></div>
    </section>
  </main>
</body>
</html>
