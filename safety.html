<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>よりそいAI｜安全性検査</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="phone scene">
    <div class="os-status"><span>9:41</span><span>5G</span></div>
    <header class="sms-top">
      <h1>メッセージ</h1>
      <p>090-4482-1937</p>
    </header>
    <div class="bubble">
      お荷物をお届けしましたが、不在のため持ち帰りました。以下のURLからご確認ください。
      <span class="url">https://example.jp/xxxxx</span>
    </div>
    <section class="alert" aria-label="AIによる安全性検査の結果">
      <p class="src">よりそいAI　安全性検査</p>
      <span class="badge">注意が必要です</span>
      <h2>宅配業者を装ったSMSの可能性があります。</h2>
      <p class="label">確認された注意点</p>
      <ul>
        <li>不審なURLへの誘導</li>
        <li>荷物の受け取りを口実にしたアクセス要求</li>
      </ul>
      <p class="label">おすすめの対応</p>
      <p class="act">URLを開かず、公式サイトから配送状況を確認してください。</p>
    </section>
  </main>
</body>
</html>
