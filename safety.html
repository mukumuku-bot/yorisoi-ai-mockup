<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>よりそいAI｜安全性検査</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="phone scene messages">
    <div class="ios-status dark">
      <span>9:41</span>
      <div class="right" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="0.6" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="#000"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="#000"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1.2 8.2a8.2 8.2 0 0 1 13.6 0M3.6 10a5.2 5.2 0 0 1 8.8 0" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.2" r="1" fill="#000"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.6" y="1" width="22" height="11" rx="2.4" stroke="#000" fill="none" stroke-width="1.2"/><rect x="2.2" y="2.6" width="16.8" height="7.8" rx="1.2" fill="#000"/><rect x="23.6" y="4.2" width="2.2" height="4.6" rx="0.7" fill="#000"/></svg>
      </div>
    </div>
    <header class="sms-top">
      <span class="back" aria-hidden="true">‹</span>
      <h1>090-4482-1937</h1>
      <p>メッセージ</p>
    </header>
    <div class="thread">
      <p class="when">今日 9:41</p>
      <div class="bubble">
        お荷物をお届けしましたが、不在のため持ち帰りました。以下のURLからご確認ください。
        <span class="url">https://example.jp/xxxxx</span>
      </div>
    </div>
    <section class="alert" aria-label="AIによる安全性検査の結果">
      <p class="src">よりそいAI　安全性検査</p>
      <span class="badge">注意が必要です</span>
      <h2>宅配業者を装ったSMSの可能性があります。</h2>
      <p class="label">確認された注意点</p>
      <ul>
        <li>不審なURLへの誘導</li>
        <li>荷物の受け取りを口実にしたアクセス要求</li>
      </ul>
      <p class="label">おすすめの対応</p>
      <p class="act">URLを開かず、公式サイトから配送状況を確認してください。</p>
    </section>
    <div class="home-ind" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
